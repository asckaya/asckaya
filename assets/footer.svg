<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 86" width="640" height="86"
     role="img" aria-label="echo &quot;LLMs were just the beginning.&quot;">
  <style>
    @keyframes blink { 0%, 52% { opacity: 1 } 53%, 100% { opacity: 0 } }
    .cursor { animation: blink 1.1s steps(1, end) infinite; }
    .mono {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
                   "DejaVu Sans Mono", "Liberation Mono", monospace;
    }
  </style>

  <!-- Echo mark — drawn inline, so there is no cross-repo dependency -->
  <g transform="translate(304, 2) scale(0.32)" fill="none">
    <circle cx="50" cy="50" r="8" fill="#88c0d0" />
    <g fill="#88c0d0">
      <circle cx="50" cy="25" r="2.5" opacity="0.75" />
      <circle cx="75" cy="50" r="2.5" opacity="0.75" />
      <circle cx="50" cy="75" r="2.5" opacity="0.75" />
      <circle cx="25" cy="50" r="2.5" opacity="0.75" />
      <circle cx="67.7" cy="32.3" r="1.5" opacity="0.35" />
      <circle cx="67.7" cy="67.7" r="1.5" opacity="0.35" />
      <circle cx="32.3" cy="67.7" r="1.5" opacity="0.35" />
      <circle cx="32.3" cy="32.3" r="1.5" opacity="0.35" />
    </g>
    <circle cx="50" cy="50" r="35" stroke="#88c0d0" stroke-width="1.6" opacity="0.18" />
  </g>

  <!-- prompt line: text-anchor=middle keeps it optically centered in any monospace fallback -->
  <text class="mono" x="320" y="66" text-anchor="middle" font-size="14.5">
    <tspan fill="#9ece6a">❯ </tspan><tspan fill="#7aa2f7">echo </tspan><tspan fill="#c0caf5">"LLMs were just the beginning."</tspan><tspan fill="#7aa2f7" class="cursor">▌</tspan>
  </text>
</svg>
